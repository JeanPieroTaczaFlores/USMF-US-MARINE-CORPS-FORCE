<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USMCF — Panel Staff</title>
  <link rel="icon" type="image/png" href="img/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body style="background:var(--auth-bg);">
  <header class="staff-header">
    <div style="display:flex;align-items:center;gap:0.8rem;">
      <img src="img/logo.png" alt="USMCF" style="width:36px;height:36px;border-radius:8px;" />
      <span style="font-family:var(--font-cond);font-weight:600;letter-spacing:0.15em;text-transform:uppercase;">USMCF STAFF</span>
    </div>
    <div style="display:flex;align-items:center;gap:1rem;">
      <span id="staffName" style="color:var(--auth-text-dim);font-size:0.85rem;"></span>
      <button class="btn-logout" onclick="logout()">SALIR</button>
    </div>
  </header>

  <main class="admin-body">
    <h1 class="staff-title">PANEL DE STAFF</h1>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-value" id="statTotal">—</div><div class="stat-label">USUARIOS</div></div>
      <div class="stat-card"><div class="stat-value" id="statPendientes">—</div><div class="stat-label">PENDIENTES</div></div>
      <div class="stat-card"><div class="stat-value" id="statMisiones">—</div><div class="stat-label">MISIONES</div></div>
    </div>

    <div class="tabs">
      <button class="tab active" data-panel="solicitudes">SOLICITUDES</button>
      <button class="tab" data-panel="usuarios">USUARIOS</button>
      <button class="tab" data-panel="misiones">MISIONES</button>
      <button class="tab" data-panel="opiniones">OPINIONES</button>
    </div>

    <div class="panel active" id="panel-solicitudes">
      <div class="table-wrap">
        <table><thead><tr><th>Nombre</th><th>Roblox</th><th>Email</th><th>Fecha</th><th>Acciones</th></tr></thead>
        <tbody id="requestsTable"></tbody></table>
      </div>
      <p id="noRequests" style="text-align:center;color:var(--auth-text-dim);padding:2rem;display:none;">No hay solicitudes pendientes.</p>
    </div>

    <div class="panel" id="panel-usuarios">
      <input type="text" class="search-bar" id="searchUsers" placeholder="Buscar..." />
      <div class="table-wrap">
        <table><thead><tr><th>Nombre</th><th>Roblox</th><th>Rango</th><th>Pts</th><th>Coins</th><th>Rol</th><th>Estado</th><th>Actividad</th></tr></thead>
        <tbody id="usersTable"></tbody></table>
      </div>
    </div>

    <div class="panel" id="panel-misiones">
      <div class="table-wrap">
        <table><thead><tr><th>Título</th><th>Fecha</th><th>Pts</th><th>Coins</th><th>Estado</th></tr></thead>
        <tbody id="missionsTable"></tbody></table>
      </div>
    </div>

    <div class="panel" id="panel-opiniones">
      <div class="table-wrap">
        <table><thead><tr><th>Fecha</th><th>Opinión</th></tr></thead>
        <tbody id="opinionsTable"></tbody></table>
      </div>
      <p id="noOpinions" style="text-align:center;color:var(--auth-text-dim);padding:2rem;display:none;">No hay opiniones.</p>
    </div>
  </main>

  <a href="https://discord.gg/jNXA6AQ4Y" class="float-discord" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg></a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/local-auth.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/missions.js"></script>
  <script src="js/opinions.js"></script>
  <script>
    (async function () {
      var profile = await getMyProfile();
      if (!profile || (profile.rol !== "staff" && profile.rol !== "admin" && profile.rol !== "super_admin")) { window.location.href = "login.html"; return; }
      if (profile.rol === "admin" || profile.rol === "super_admin") { window.location.href = "admin.html"; return; }
      document.getElementById("staffName").textContent = profile.nombre + " (STAFF)";

      document.querySelectorAll(".tab").forEach(function (t) {
        t.addEventListener("click", function () {
          document.querySelectorAll(".tab").forEach(function (x) { x.classList.remove("active"); });
          document.querySelectorAll(".panel").forEach(function (x) { x.classList.remove("active"); });
          t.classList.add("active");
          document.getElementById("panel-" + t.dataset.panel).classList.add("active");
        });
      });

      document.getElementById("searchUsers").addEventListener("input", async function (e) {
        var q = e.target.value.toLowerCase();
        var r = await supabase.from("profiles").select("*");
        var filtered = (r.data || []).filter(function (u) { return (u.nombre + u.usuario_roblox + u.rango).toLowerCase().indexOf(q) !== -1; });
        renderUsers(filtered);
      });

      await Promise.all([loadRequests(), loadUsers(), loadMissions(), loadOpinions()]);
    })();

    async function loadRequests() {
      var r = await supabase.from("profiles").select("*").eq("estado", "pendiente").order("created_at");
      var reqs = r.data || [];
      document.getElementById("statPendientes").textContent = reqs.length;
      if (reqs.length === 0) { document.getElementById("noRequests").style.display = "block"; document.getElementById("requestsTable").innerHTML = ""; return; }
      document.getElementById("noRequests").style.display = "none";
      document.getElementById("requestsTable").innerHTML = reqs.map(function (u) {
        return '<tr><td>' + u.nombre + '</td><td>' + u.usuario_roblox + '</td><td>' + u.email + '</td><td>' + new Date(u.created_at).toLocaleDateString("es-PE") + '</td><td><button class="btn-sm btn-accept" onclick="approve(\'' + u.id + '\')">APROBAR</button> <button class="btn-sm btn-reject" onclick="reject(\'' + u.id + '\')">RECHAZAR</button></td></tr>';
      }).join("");
    }
    async function approve(id) { await supabase.from("profiles").update({ estado: "activo", rango: "Soldado", dinero: 500, puntos: 100 }).eq("id", id); await Promise.all([loadUsers(), loadRequests()]); }
    async function reject(id) { if (!confirm("¿Rechazar?")) return; await supabase.from("profiles").delete().eq("id", id); await Promise.all([loadUsers(), loadRequests()]); }

    async function loadUsers() {
      var r = await supabase.from("profiles").select("*").order("created_at", { ascending: false });
      document.getElementById("statTotal").textContent = (r.data || []).length;
      renderUsers(r.data || []);
    }
    function renderUsers(users) {
      document.getElementById("usersTable").innerHTML = users.map(function (u) {
        var lastLogin = u.last_login ? timeAgo(u.last_login) : "Nunca";
        var activityColor = u.last_login ? (Date.now() - new Date(u.last_login).getTime() < 3600000 ? "var(--auth-success)" : "var(--auth-text-dim)") : "var(--auth-error)";
        return '<tr><td>' + u.nombre + '</td><td>' + u.usuario_roblox + '</td><td>' + u.rango + '</td><td>' + u.puntos + '</td><td>' + u.dinero + '</td><td><span class="badge badge-' + (u.rol === "staff" ? "pendiente" : "activo") + '">' + u.rol + '</span></td><td><span class="badge badge-' + u.estado + '">' + u.estado + '</span></td><td style="color:' + activityColor + ';font-size:0.8rem;">' + lastLogin + '</td></tr>';
      }).join("");
    }
    function timeAgo(dateStr) {
      var diff = Date.now() - new Date(dateStr).getTime();
      var mins = Math.floor(diff / 60000);
      if (mins < 1) return "Ahora";
      if (mins < 60) return mins + "min";
      var hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + "h";
      var days = Math.floor(hrs / 24);
      return days + "d";
    }

    async function loadMissions() {
      var missions = await USMCF.Missions.list();
      document.getElementById("statMisiones").textContent = missions.length;
      document.getElementById("missionsTable").innerHTML = missions.map(function (m) {
        return '<tr><td>' + m.titulo + '</td><td>' + new Date(m.fecha).toLocaleDateString("es-PE") + '</td><td>' + m.recompensa_puntos + '</td><td>' + m.recompensa_dinero + '</td><td><span class="badge badge-' + (m.estado === "activa" ? "pendiente" : m.estado === "terminada" ? "activo" : "inactivo") + '">' + m.estado + '</span></td></tr>';
      }).join("");
    }

    async function loadOpinions() {
      var opinions = await USMCF.Opinions.list();
      if (opinions.length === 0) { document.getElementById("noOpinions").style.display = "block"; return; }
      document.getElementById("noOpinions").style.display = "none";
      document.getElementById("opinionsTable").innerHTML = opinions.map(function (o) {
        return '<tr><td>' + new Date(o.created_at).toLocaleDateString("es-PE") + '</td><td>' + o.texto + '</td></tr>';
      }).join("");
    }
  </script>
</body>
</html>
