<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USMCF — Tienda</title>
  <link rel="icon" type="image/png" href="img/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <style>
    .shop-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.2rem;margin:1.5rem 0; }
    .shop-card { background:var(--auth-card);border:1px solid var(--auth-border);border-radius:10px;overflow:hidden;transition:border-color 0.2s; }
    .shop-card:hover { border-color:rgba(200,16,46,0.3); }
    .shop-card-img { width:100%;height:160px;background:rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;font-size:3rem; }
    .shop-card-body { padding:1.2rem; }
    .shop-card-name { font-family:var(--font-cond);font-size:1rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--auth-text);margin-bottom:0.3rem; }
    .shop-card-desc { font-size:0.85rem;color:var(--auth-text-dim);margin-bottom:0.8rem;line-height:1.4; }
    .shop-card-price { display:flex;gap:0.8rem;margin-bottom:1rem; }
    .price-tag { padding:0.25rem 0.6rem;border-radius:4px;font-family:var(--font-cond);font-size:0.75rem;font-weight:600;letter-spacing:0.08em; }
    .price-coins { background:rgba(212,168,67,0.15);color:var(--auth-gold); }
    .price-pts { background:rgba(200,16,46,0.15);color:var(--auth-red); }
    .shop-buy-btn { width:100%;padding:0.6rem;border:none;border-radius:6px;background:var(--auth-red);color:#fff;font-family:var(--font-cond);font-size:0.8rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:background 0.2s; }
    .shop-buy-btn:hover { background:var(--auth-red-dark); }
    .shop-buy-btn:disabled { opacity:0.4;cursor:not-allowed; }
    .shop-empty { text-align:center;padding:4rem 1rem;color:var(--auth-text-dim); }
    .shop-empty-icon { font-size:3rem;margin-bottom:1rem;opacity:0.3; }
    .shop-balance { display:flex;gap:1.5rem;margin-bottom:1.5rem;padding:1rem 1.2rem;background:var(--auth-card);border:1px solid var(--auth-border);border-radius:8px; }
    .shop-balance-item { display:flex;flex-direction:column; }
    .shop-balance-label { font-family:var(--font-cond);font-size:0.7rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--auth-text-dim); }
    .shop-balance-value { font-family:var(--font-display);font-size:1.4rem;color:var(--auth-text); }
    .inventory-section { margin-top:2rem;border-top:1px solid var(--auth-border);padding-top:1.5rem; }
    .section-title { font-family:var(--font-cond);font-size:0.8rem;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;color:var(--auth-gold);margin-bottom:1rem;border-left:3px solid var(--auth-red);padding-left:0.8rem; }
  </style>
</head>
<body style="background:var(--auth-bg);">
  <header class="dash-header">
    <div class="dash-header-brand">
      <img src="img/logo.png" alt="USMCF" />
      <span>USMCF</span>
    </div>
    <div style="display:flex;align-items:center;gap:1rem;">
      <a href="index.html" class="btn btn-ghost" style="color:var(--auth-text-dim);border:1px solid var(--auth-border);padding:0.4rem 0.8rem;font-size:0.78rem;border-radius:6px;text-decoration:none;">INICIO</a>
      <button class="btn-logout" onclick="logout()">SALIR</button>
    </div>
  </header>

  <main style="max-width:1200px;margin:0 auto;padding:1.5rem 2rem 3rem;">
    <h1 class="section-title">TIENDA USMCF</h1>

    <div class="shop-balance" id="shopBalance">
      <div class="shop-balance-item">
        <span class="shop-balance-label">DINERO</span>
        <span class="shop-balance-value" id="myDinero">—</span>
      </div>
      <div class="shop-balance-item">
        <span class="shop-balance-label">PUNTOS</span>
        <span class="shop-balance-value" id="myPuntos">—</span>
      </div>
    </div>

    <div id="shopItems" class="shop-grid"></div>
    <div id="shopEmpty" class="shop-empty" style="display:none;">
      <div class="shop-empty-icon">&#128722;</div>
      <p>La tienda está vacía. Pronto habrá items disponibles.</p>
    </div>

    <div class="inventory-section">
      <h2 class="section-title">MI INVENTARIO</h2>
      <div id="myInventory" class="shop-grid"></div>
      <div id="invEmpty" class="shop-empty" style="display:none;padding:2rem;">
        <p>Aún no has comprado nada.</p>
      </div>
    </div>
  </main>

  <a href="https://discord.gg/jNXA6AQ4Y" class="float-discord" target="_blank" rel="noopener" aria-label="Únete al Discord de USMCF">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
  </a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/local-auth.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/shop.js"></script>
  <script>
    (async function () {
      var profile = await getMyProfile();
      if (!profile || profile.estado !== "activo") { window.location.href = "login.html"; return; }

      document.getElementById("myDinero").textContent = profile.dinero.toLocaleString() + " coins";
      document.getElementById("myPuntos").textContent = profile.puntos.toLocaleString() + " pts";

      var items = await USMCF.Shop.listItems();
      var grid = document.getElementById("shopItems");
      var empty = document.getElementById("shopEmpty");

      if (items.length === 0) {
        empty.style.display = "block";
      } else {
        grid.innerHTML = items.map(function (item) {
          var icons = { "arma": "&#128299;", "skin": "&#128084;", "rango": "&#9733;", "general": "&#128722;" };
          return '<div class="shop-card">' +
            '<div class="shop-card-img">' + (icons[item.tipo] || icons.general) + '</div>' +
            '<div class="shop-card-body">' +
            '<div class="shop-card-name">' + item.nombre + '</div>' +
            '<div class="shop-card-desc">' + (item.descripcion || '') + '</div>' +
            '<div class="shop-card-price">' +
            (item.precio_dinero > 0 ? '<span class="price-tag price-coins">' + item.precio_dinero + ' coins</span>' : '') +
            (item.precio_puntos > 0 ? '<span class="price-tag price-pts">' + item.precio_puntos + ' pts</span>' : '') +
            (item.stock >= 0 ? '<span class="price-tag" style="background:rgba(255,255,255,0.06);color:var(--auth-text-dim);">Stock: ' + item.stock + '</span>' : '') +
            '</div>' +
            '<button class="shop-buy-btn" onclick="buyItem(\'' + item.id + '\', this)">COMPRAR</button>' +
            '</div></div>';
        }).join("");
      }

      // Inventario
      var inv = await USMCF.Shop.getInventory(profile.id);
      var invGrid = document.getElementById("myInventory");
      var invEmpty = document.getElementById("invEmpty");
      if (inv.length === 0) {
        invEmpty.style.display = "block";
      } else {
        invGrid.innerHTML = inv.map(function (item) {
          return '<div class="shop-card">' +
            '<div class="shop-card-body">' +
            '<div class="shop-card-name">' + item.nombre + '</div>' +
            '<div class="shop-card-desc">' + (item.descripcion || '') + '</div>' +
            '<div style="font-size:0.75rem;color:var(--auth-text-dim);">Comprado: ' + new Date(item.comprado_at).toLocaleDateString("es-PE") + '</div>' +
            '</div></div>';
        }).join("");
      }
    })();

    async function buyItem(itemId, btn) {
      btn.disabled = true;
      btn.textContent = "COMPRANDO...";
      var result = await USMCF.Shop.buy(itemId, (await getMyProfile()).id);
      if (result.error) {
        alert(result.error);
        btn.disabled = false;
        btn.textContent = "COMPRAR";
      } else {
        alert("¡Compra exitosa!");
        window.location.reload();
      }
    }
  </script>
</body>
</html>
